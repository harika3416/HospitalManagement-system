<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="dashboard.css" />
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap");

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background-color: #f4f6f9;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(90deg, #003A74, #006AD5);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      display: flex;
      flex: 1;
    }

    nav {
      width: 250px;
      background-color: #ffffff;
      box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
      padding: 20px;
    }

    nav a {
      display: block;
      margin-bottom: 15px;
      color: #003A74;
      text-decoration: none;
      font-weight: 600;
    }

    main {
      flex: 1;
      padding: 30px;
    }

    .card {
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 1px 5px 10px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
    }

    .card h3 {
      margin-bottom: 10px;
    }

    footer {
      background-color: #003A74;
      color: white;
      text-align: center;
      padding: 10px;
    }
    #patientsSubmenu a {
  font-weight: 500;
  color: #006AD5;
  text-decoration: none;
  display: block;
  margin-bottom: 10px;
}
 #Submenu a {
  font-weight: 500;
  color: #006AD5;
  text-decoration: none;
  display: block;
  margin-bottom: 10px;
}
    
  </style>
</head>
<body>

  <header>
    <h1>Welcome, Admin</h1>
  </header>

  <div class="container">
    <nav>
      <a href="admindashboard.html">Dashboard</a>
      <a href="#" id="managePatientsToggle">Manage Doctors</a>
<div id="patientsSubmenu" style="display: none; margin-left: 15px;">
  <a href="doctorreg.html">Add Doctors</a>
  <a href="updatespec.html">Update specialization</a>
</div>
      
     
     
      
      <a href="#" id="manageToggle">Manage patients</a>
<div id="Submenu" style="display: none; margin-left: 15px;">
  <a href="patientsauthorization.jsp">Authorize patients</a>
  
</div>
      
    <a href="#">view feedback</a>
      <a href="home.html">Logout</a>
    </nav>

    <main>

        <p>No critical alerts. All systems running smoothly.</p>
      </div>
    </main>
  </div>

  <footer>
    &copy; 2025 Hospital Admin Panel
  </footer>

</body>
<script>
  const toggle1 = document.getElementById('manageToggle');
  const submenu2 = document.getElementById('Submenu');
  const toggle = document.getElementById('managePatientsToggle');
  const  submenu= document.getElementById('patientsSubmenu');

  toggle.addEventListener('click', function (e) {
    e.preventDefault();
    submenu.style.display = submenu.style.display === 'none' ? 'block' : 'none';
  });
  toggle1.addEventListener('click', function (e) {
	    e.preventDefault();
	    submenu2.style.display = submenu2.style.display === 'none' ? 'block' : 'none';
	  });
</script>
